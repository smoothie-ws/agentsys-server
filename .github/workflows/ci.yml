name: Independent product CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test -- --test-concurrency=1
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.os }}-${{ matrix.node }}
          path: '*.tgz'

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentsys-server:ci .
      - run: docker run -d --name agentsys-ci -p 8080:8080 -e AGENTSYS_TOKEN=ci-container-token agentsys-server:ci
      - run: curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8080/api/meta
      - run: test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/index.html)" = 404
      - if: always()
        run: docker logs agentsys-ci
